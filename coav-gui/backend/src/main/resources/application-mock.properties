# Mock profile — FlightSimulatorService generates synthetic data, no Azure credentials needed
# Run: java -jar coav-gui-backend.jar --spring.profiles.active=mock
#      docker run -e SPRING_PROFILES_ACTIVE=mock coav-gui-backend:v1

# Free-tier single-host demo: replay precomputed GVCCS camera inference from inside the backend
# (no Azure Event Hub, no emulator). Off by default — enable per deployment with either:
#   docker run -e SPRING_PROFILES_ACTIVE=mock -e COAV_MOCKCAMERA_ENABLED=true ...
#   java -jar coav-gui-backend.jar --spring.profiles.active=mock --coav.mock-camera.enabled=true
coav.mock-camera.enabled=false
